# Root page for lemb.dev. Also the catch-all for unknown *.lemb.dev hosts: everything except / is a real 404.
server_tokens off;

# Client IP from the proxy chain: Cloudflare -> NPM (10.10.10.0/24) -> Traefik (pod network 10.42.0.0/16)
set_real_ip_from 10.10.10.0/24;
set_real_ip_from 10.42.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent","cf_ray":"$http_cf_ray"}';

# Shared by both servers below
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

server {
    listen 8080;
    server_name lemb.dev;
    access_log /dev/stdout json;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Any other host (unknown *.lemb.dev, probes by IP) gets a real 404, even for /
server {
    listen 8080 default_server;
    # Server-level access_log replaces the plain-text one from the base nginx.conf
    access_log /dev/stdout json;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
