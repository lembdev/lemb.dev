name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lembdev/lemb.dev
  # Kustomization in lembdev/homelab that Argo CD syncs to the cluster
  GITOPS_PATH: k8s/apps/lemb-dev/kustomization.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in GitOps repo
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitops && chmod 600 ~/.ssh/gitops
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitops -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:lembdev/homelab.git gitops
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|^\(\s*newTag:\).*|\1 $TAG|" "$GITOPS_PATH"
          git add "$GITOPS_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "chore: deploy lemb-dev $TAG"
          # Another app may have pushed in between: rebase and retry
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
